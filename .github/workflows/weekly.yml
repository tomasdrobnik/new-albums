name: weekly-new-albums

on:
  schedule:
    # musicserver.cz published week 38-42 on Wednesdays between 13:00 and 15:00 (local time).
    # Run Wed afternoon plus two fallbacks; the script skips weeks already stored.
    - cron: "30 15 * * 3"
    - cron: "30 6 * * 4"
    - cron: "30 6 * * 5"
  workflow_dispatch:
    inputs:
      url:
        description: "Article URL (optional, default = newest)"
        required: false
      notify_week:
        description: "Only re-send the notification for this stored week (e.g. 2026-w42)"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      HAS_SMTP: ${{ secrets.SMTP_USER != '' && secrets.SMTP_PASS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python tests/test_parse.py
      - name: Scrape
        if: ${{ !github.event.inputs.notify_week }}
        env:
          ARTICLE_URL: ${{ github.event.inputs.url }}
        run: |
          if [ -n "$ARTICLE_URL" ]; then
            python scraper/scrape.py --url "$ARTICLE_URL"
          else
            python scraper/scrape.py
          fi
      - name: Commit new data
        id: commit
        env:
          NOTIFY_WEEK: ${{ github.event.inputs.notify_week }}
        run: |
          if [ -n "$NOTIFY_WEEK" ]; then
            echo "file=docs/data/archive/$NOTIFY_WEEK.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "new-albums-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          new=$(git diff --cached --name-only --diff-filter=A -- docs/data/archive | grep '\.json$' | sort | tail -1 || true)
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: new albums week $(date +%G-%V)"
            git push
          fi
          echo "file=$new" >> "$GITHUB_OUTPUT"
      - name: Notify by email (SMTP secrets set)
        id: mail
        continue-on-error: true
        if: ${{ steps.commit.outputs.file != '' && env.HAS_SMTP == 'true' }}
        env:
          FILE: ${{ steps.commit.outputs.file }}
          PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python scraper/notify.py email "$FILE" "$PAGE"
      - name: Notify by GitHub issue (fallback - no SMTP secrets or email failed)
        if: ${{ steps.commit.outputs.file != '' && (env.HAS_SMTP != 'true' || steps.mail.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.commit.outputs.file }}
          PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python scraper/notify.py issue "$FILE" "$PAGE" > body.md
          title=$(head -1 body.md); tail -n +2 body.md > issue.md
          if [ "${{ steps.mail.outcome }}" = "failure" ]; then
            printf '\n\n> Email sending failed - check the SMTP_USER / SMTP_PASS secrets (see the Action log).\n' >> issue.md
          fi
          gh label create new-week --color 1a7f4b --description "Weekly new albums notification" 2>/dev/null || true
          for n in $(gh issue list --label new-week --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Superseded by a newer week."
          done
          gh issue create --title "$title" --body-file issue.md --label new-week
